name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -q

  postgres:
    # The run queue's claim path (FOR UPDATE SKIP LOCKED) and the streaming
    # sink's row-locked fence only execute on PostgreSQL. Without this job those
    # tests skip, and the concurrency guarantees the README advertises go
    # unverified on every push.
    name: pytest against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dp
          POSTGRES_PASSWORD: dp
          POSTGRES_DB: dp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATAPLATFORM_TEST_POSTGRES_URL: postgresql+psycopg2://dp:dp@localhost:5432/dp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: The PostgreSQL-only tests must actually run
        # These tests skip themselves when the database is unreachable, so a
        # misconfigured service would produce a green job that verified nothing.
        # Fail loudly instead.
        run: |
          pytest tests/test_queue_leases_postgres.py -q | tee pg-tests.log
          if grep -q "skipped" pg-tests.log; then
            echo "::error::PostgreSQL tests skipped - the service was not reachable"
            exit 1
          fi
      - name: Run the full suite against PostgreSQL
        run: pytest tests/ -q

  lineage:
    # The lineage graph is only worth building if something queries it. This is
    # the query: parse the models as this branch has them, compare against the
    # models at the base commit, and fail when a column that something reads
    # stops being produced.
    name: column lineage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # --git-ref reads the models as they were at the base commit, so the
          # comparison needs history rather than a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Blast radius of any removed column
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="${{ github.event.before }}"; fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          echo "comparing against $BASE"
          dataplatform lineage check \
            --models demo/fixtures/models \
            --schema demo/fixtures/catalog.json \
            --git-ref "$BASE" \
            --annotate

  browser:
    # Nothing else in CI touches the UI. Three shipped bugs were found by hand
    # -- a lineage graph that never rendered, a health pill hardcoded to
    # HEALTHY, and stat cards collapsed by a Tailwind class with no base rule
    # -- and each is one assertion here.
    name: browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Install the browser
        run: python -m playwright install --with-deps chromium
      - name: The browser tests must actually run
        # They skip themselves when playwright or the browser is missing, so a
        # broken install would leave this job green having checked nothing.
        run: |
          pytest -m browser -q | tee browser-tests.log
          if grep -qE "no tests ran|[0-9]+ skipped" browser-tests.log; then
            echo "::error::browser tests did not run - playwright or chromium is missing"
            exit 1
          fi
