pipeline_name: ai_llm_eval_guardrails_pipeline
description: LLM evaluation and guardrails pipeline for prompt, model, retrieval, and safety release gates
tags:
  - ai
  - llmops
  - evaluation
  - guardrails
  - model-comparison

execution:
  profile: prod
  deployment_target: kubernetes
  default_layer: quality
  max_parallel_tasks: 4

tasks:
  - name: collect_eval_dataset
    type: executor
    plugin: python
    operation: execute_code
    execution_layer: ingest
    config:
      code: |
        from pathlib import Path
        import json

        Path("data/ai").mkdir(parents=True, exist_ok=True)
        dataset = {
            "sources": sources,
            "golden_set_size": golden_set_size,
            "coverage": coverage_dimensions
        }
        Path(output_dataset_manifest).write_text(json.dumps(dataset, indent=2), encoding="utf-8")
        print("Evaluation dataset manifest prepared")
      parameters:
        sources:
          - production_traces
          - golden_questions
          - adversarial_prompts
        golden_set_size: 250
        coverage_dimensions:
          - factuality
          - refusal
          - citation_quality
          - tool_use
          - latency
        output_dataset_manifest: data/ai/llm_eval_dataset_manifest.json
    lineage:
      writes_to:
        - file://data/ai/llm_eval_dataset_manifest.json

  - name: run_quality_evaluations
    type: executor
    plugin: python
    operation: execute_code
    execution_layer: quality
    depends_on:
      - collect_eval_dataset
    config:
      code: |
        quality_suite = {
            "evaluators": evaluators,
            "min_overall_score": min_overall_score,
            "judge_model": judge_model
        }
        print(f"Quality evaluation suite: {quality_suite}")
      parameters:
        evaluators:
          - answer_correctness
          - faithfulness
          - citation_coverage
          - instruction_following
        judge_model: "${OPENAI_EVAL_MODEL}"
        min_overall_score: 0.86

  - name: run_safety_and_policy_checks
    type: executor
    plugin: python
    operation: execute_code
    execution_layer: quality
    depends_on:
      - collect_eval_dataset
    config:
      code: |
        safety_suite = {
            "checks": checks,
            "blocked_content_max": blocked_content_max,
            "pii_leakage_max": pii_leakage_max
        }
        print(f"Safety evaluation suite: {safety_suite}")
      parameters:
        checks:
          - pii_leakage
          - prompt_injection
          - jailbreak_resistance
          - unsafe_completion
        blocked_content_max: 0.01
        pii_leakage_max: 0.0

  - name: compare_model_candidates
    type: executor
    plugin: python
    operation: execute_code
    execution_layer: transform
    depends_on:
      - run_quality_evaluations
      - run_safety_and_policy_checks
    config:
      code: |
        comparison = {
            "candidates": candidate_models,
            "dimensions": comparison_dimensions,
            "winner_policy": winner_policy
        }
        print(f"Model candidate comparison: {comparison}")
      parameters:
        candidate_models:
          - production_model
          - challenger_model
        comparison_dimensions:
          - quality
          - cost
          - latency
          - safety
        winner_policy: quality_and_safety_first

  - name: publish_release_gate_report
    type: executor
    plugin: file
    operation: create
    execution_layer: operate
    depends_on:
      - compare_model_candidates
    config:
      file_path: data/ai/llm_release_gate_report.json
      content: |
        {
          "release_gate": "llm_quality_safety_cost_latency",
          "required_status": "passed",
          "rollback_policy": "keep_previous_model_until_all_gates_pass"
        }
    lineage:
      writes_to:
        - file://data/ai/llm_release_gate_report.json
