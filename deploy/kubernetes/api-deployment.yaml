apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataplatform-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dataplatform-api
  template:
    metadata:
      labels:
        app: dataplatform-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: initialize-storage
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /storage/logs /storage/pipelines /storage/git-clones"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /storage
      containers:
        - name: api
          image: dataplatform:local
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "dataplatform.cli.main", "serve", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: dataplatform-config
            - secretRef:
                name: dataplatform-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: data
              mountPath: /app/logs
              subPath: logs
            - name: data
              mountPath: /app/pipelines
              subPath: pipelines
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dataplatform-data