services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  dataplatform:
    environment:
      DATAPLATFORM_ENV: production
      DATAPLATFORM_USERNAME: ${DATAPLATFORM_USERNAME:?DATAPLATFORM_USERNAME is required}
      DATAPLATFORM_PASSWORD: ${DATAPLATFORM_PASSWORD:?DATAPLATFORM_PASSWORD is required}
      DATAPLATFORM_SESSION_SECRET: ${DATAPLATFORM_SESSION_SECRET:?DATAPLATFORM_SESSION_SECRET is required}
      DATAPLATFORM_EXECUTION_MODE: external
      POSTGRES_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  dataplatform-worker:
    environment:
      DATAPLATFORM_ENV: production
      DATAPLATFORM_USERNAME: ${DATAPLATFORM_USERNAME:?DATAPLATFORM_USERNAME is required}
      DATAPLATFORM_PASSWORD: ${DATAPLATFORM_PASSWORD:?DATAPLATFORM_PASSWORD is required}
      DATAPLATFORM_SESSION_SECRET: ${DATAPLATFORM_SESSION_SECRET:?DATAPLATFORM_SESSION_SECRET is required}
      DATAPLATFORM_EXECUTION_MODE: external
      POSTGRES_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G